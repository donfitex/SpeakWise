name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: speakwise
          POSTGRES_USER: speakwise
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U speakwise" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
      TEST_POSTGRES: "true"
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://speakwise:ci-only@localhost:5432/speakwise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ruff check backend
      - run: ruff format --check backend
      - run: python backend/manage.py check
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  journey:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: synthetic-ci-only-not-for-production
      DATABASE_URL: sqlite:////tmp/speakwise-e2e.sqlite3
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -r ../requirements.lock
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python ../backend/manage.py migrate --noinput && python ../backend/manage.py seed_demo
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-evidence, path: frontend/test-results, retention-days: 7}
