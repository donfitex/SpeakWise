name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: speakwise
          POSTGRES_USER: speakwise
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U speakwise" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-deployment
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://speakwise:ci-only@localhost:5432/speakwise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.lock
      - run: ruff check backend
      - run: ruff format --check backend
      - run: python backend/manage.py check
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
