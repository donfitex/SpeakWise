[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/speakwise-supervisor.pid

[program:api]
directory=/app/backend
command=gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 1 --timeout 120 --access-logfile /dev/null
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=caddy run --config /app/deploy/render/Caddyfile --adapter caddyfile
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:retention]
command=sh /app/deploy/render/retention.sh
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
