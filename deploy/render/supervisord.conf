[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/speakwise-supervisor.pid

[program:api]
directory=/app/backend
command=gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 1 --timeout 120 --access-logfile /dev/null
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
directory=/app/backend
command=celery -A config worker --loglevel=warning --concurrency=1
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
directory=/app/backend
command=celery -A config beat --loglevel=warning --schedule=/tmp/speakwise-beat --pidfile=/tmp/speakwise-beat.pid
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=caddy run --config /app/deploy/render/Caddyfile --adapter caddyfile
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
